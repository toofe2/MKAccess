name: Build MKAccess

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "MKAccess/**"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build iOS arm64 dylib
        run: |
          set -euxo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          mkdir -p build
          xcrun --sdk iphoneos clang             -arch arm64             -miphoneos-version-min=15.0             -isysroot "$SDK"             -fobjc-arc             -dynamiclib             -install_name "@rpath/MKAccess.dylib"             MKAccess/MKAccess.m             -framework Foundation             -framework UIKit             -o build/MKAccess.dylib
          file build/MKAccess.dylib
          codesign -s - --force build/MKAccess.dylib
      - uses: actions/upload-artifact@v4
        with:
          name: MKAccess-arm64
          path: build/MKAccess.dylib
